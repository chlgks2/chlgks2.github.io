  <title id="gb-flow-title">공구한 서비스 플로차트</title>
  <desc id="gb-flow-desc">홈에서 상품 탐색, 찜, 마이페이지, 판매자센터로 분기합니다. 구매는 상세 화면, 로그인 확인, 배송지, 결제, 주문 완료로 이어집니다. 판매자 인증을 마치면 상품 등록, 선택적인 AI 정보 입력과 검토, 공동구매 개설 및 판매 관리를 진행합니다.</desc>
  <defs>
    <marker id="gb-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#49556b"/></marker>
    <marker id="gb-flow-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b8dff"/></marker>
  </defs>
  <style>
    .flow-edge { fill:none; stroke:#49556b; stroke-width:1.3; stroke-dasharray:3 4; marker-end:url(#gb-flow-arrow); }
    .flow-edge.blue { stroke:#5b8dff; marker-end:url(#gb-flow-blue-arrow); }
    .flow-node { fill:#161c27; stroke:#2f3846; stroke-width:1.2; }
    .flow-node.main { fill:#16203a; stroke:#3c5a9e; stroke-width:1.2; }
    .flow-node.sub { fill:#1a202b; stroke:#2a3242; stroke-width:1.1; }
    .flow-node.end { fill:#132318; stroke:#2d5c3e; stroke-width:1.1; }
    .flow-label { font-family:Pretendard,"Malgun Gothic",sans-serif; font-size:15px; fill:#b9c0ce; text-anchor:middle; }
    .flow-label.main { fill:#8fb2ff; font-weight:700; }
    .flow-note { font-family:Pretendard,"Malgun Gothic",sans-serif; font-size:11px; fill:#8a92a3; text-anchor:middle; }
  </style>
