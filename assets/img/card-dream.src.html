<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:675px;overflow:hidden;
    font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#0d2944;}
  .card{position:relative;width:1200px;height:675px;display:flex;align-items:center;gap:62px;
    padding:0 76px;
    background:
      radial-gradient(880px 520px at 16% 28%, rgba(120,214,255,.30), transparent 62%),
      radial-gradient(760px 500px at 88% 82%, rgba(90,160,255,.24), transparent 62%),
      linear-gradient(145deg,#15507e 0%,#0f3a60 48%,#0c2a46 100%);}
  .grid{position:absolute;inset:0;opacity:.6;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(760px 520px at 24% 46%,#000 10%,transparent 78%);}

  .tile{position:relative;flex:0 0 300px;width:300px;height:300px;border-radius:70px;
    background:linear-gradient(165deg,#ffffff 0%,#eaf7ff 60%,#d9efff 100%);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 34px 70px -24px rgba(0,20,40,.8), inset 0 1px 0 rgba(255,255,255,.9),
               0 0 80px -16px rgba(120,214,255,.65);
    display:flex;align-items:center;justify-content:center;}
  .tile svg{width:196px;height:196px;overflow:visible}

  .txt{flex:1;min-width:0;padding-bottom:6px}
  h1{font-size:84px;font-weight:800;letter-spacing:-.045em;color:#ffffff;line-height:1;
     margin-bottom:20px;white-space:nowrap}
  .sub{font-size:28px;font-weight:700;letter-spacing:-.034em;color:#a6e2ff;margin-bottom:12px}
  .feat{font-size:23px;font-weight:600;letter-spacing:-.028em;color:#c3dcef;line-height:1.5;
        margin-bottom:30px}
  .chips{display:flex;gap:11px;flex-wrap:wrap}
  .chips span{font-size:20px;font-weight:600;letter-spacing:-.02em;color:#dceaf6;
    padding:9px 20px;border-radius:999px;
    border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1)}
  .chips span.on{color:#0c3b5e;border-color:rgba(255,255,255,.7);background:rgba(206,238,255,.92)}
</style></head>
<body>
<div class="card">
  <div class="grid"></div>

  <div class="tile">
    <svg viewBox="0 0 200 200" fill="none">
      <g stroke-linecap="round" stroke-width="17">
        <path d="M22 100 V100"  stroke="#7ec8f2"/>
        <path d="M50 74  V126"  stroke="#5bb6ec"/>
        <path d="M78 40  V160"  stroke="#2f95dd"/>
        <path d="M106 18 V182"  stroke="#1178c6"/>
        <path d="M134 52 V148"  stroke="#2f95dd"/>
        <path d="M162 80 V120"  stroke="#5bb6ec"/>
      </g>
      <!-- 변환 화살표 -->
      <path d="M22 100 H178" stroke="#e07b1f" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="2 20" opacity=".9"/>
    </svg>
  </div>

  <div class="txt">
    <h1>Dream Shaper</h1>
    <div class="sub">AI 음성 커버 생성 서비스</div>
    <div class="feat">화자 5명 음성 모델을 직접 학습<br>백엔드 인력 이탈 후 AI 서버를 2주 안에 구축</div>
    <div class="chips">
      <span class="on">diff-svc</span>
      <span class="on">FastAPI</span>
      <span>HuBERT</span>
      <span>DALL·E 2</span>
      <span>194시간 학습</span>
    </div>
  </div>
</div>
</body></html>
