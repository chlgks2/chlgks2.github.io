<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:675px;overflow:hidden;
    font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    background:#0b0f14;}
  .card{position:relative;width:1200px;height:675px;display:flex;align-items:center;gap:62px;
    padding:0 76px;
    background:
      radial-gradient(820px 480px at 16% 30%, rgba(46,196,196,.20), transparent 62%),
      radial-gradient(640px 440px at 58% 86%, rgba(176,108,207,.18), transparent 60%),
      radial-gradient(560px 400px at 92% 20%, rgba(247,160,70,.16), transparent 60%),
      linear-gradient(145deg,#0d1218 0%,#0a0e14 52%,#0c1016 100%);}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(760px 520px at 24% 46%,#000 10%,transparent 78%);}

  /* 로고 타일 */
  .tile{position:relative;flex:0 0 300px;width:300px;height:300px;border-radius:70px;
    background:linear-gradient(160deg,#17202b 0%,#101722 58%,#0d131c 100%);
    border:1px solid rgba(120,220,215,.20);
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 34px 70px -24px rgba(0,0,0,.95),
               inset 0 1px 0 rgba(255,255,255,.07),
               0 0 72px -14px rgba(46,196,196,.42);
    display:flex;align-items:center;justify-content:center;}
  .tile svg{width:188px;height:188px;overflow:visible}

  .txt{flex:1;min-width:0;padding-bottom:6px}
  h1{font-size:88px;font-weight:800;letter-spacing:-.045em;color:#eef3f7;line-height:1;
     margin-bottom:20px;display:flex;align-items:center;gap:22px}
  .wip{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#5fe0d6;
    padding:9px 20px 10px;border-radius:999px;align-self:center;margin-top:6px;
    border:1px solid rgba(70,214,205,.45);background:rgba(46,196,196,.12);
    white-space:nowrap}
  h1 em{font-style:normal;color:#45d6cd}
  .sub{font-size:28px;font-weight:700;letter-spacing:-.032em;color:#45d6cd;margin-bottom:12px}
  .feat{font-size:23px;font-weight:600;letter-spacing:-.028em;color:#8f9fae;line-height:1.5;
        margin-bottom:30px}
  .chips{display:flex;gap:11px;flex-wrap:wrap}
  .chips span{font-size:20px;font-weight:600;letter-spacing:-.02em;color:#b9c6d2;
    padding:9px 20px;border-radius:999px;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.045)}
  .chips span.on{color:#5fe0d6;border-color:rgba(70,214,205,.45);background:rgba(46,196,196,.12)}
  .chips span.pu{color:#c9a4fb;border-color:rgba(176,108,207,.5);background:rgba(176,108,207,.14)}
  .chips span.or{color:#f7b477;border-color:rgba(247,160,70,.5);background:rgba(247,160,70,.13)}
  .chips span.pk{color:#f79bb6;border-color:rgba(240,120,160,.5);background:rgba(240,120,160,.13)}
</style></head>
<body>
<div class="card">
  <div class="grid"></div>

  <div class="tile">
    <svg viewBox="0 0 200 200" fill="none">
      <!-- 메인 줄기 -->
      <path d="M68 180 V20" stroke="#2ec4c4" stroke-width="12" stroke-linecap="round"/>
      <!-- 갈라졌다가 다시 합쳐지는 가지 -->
      <path d="M68 152 C68 128 136 140 136 118 V86 C136 64 68 76 68 52"
            stroke="#b06ccf" stroke-width="12" stroke-linecap="round"/>
      <!-- 커밋 점 -->
      <circle cx="68"  cy="180" r="16" fill="#101722" stroke="#2ec4c4" stroke-width="12"/>
      <circle cx="136" cy="102" r="15" fill="#101722" stroke="#b06ccf" stroke-width="11"/>
      <circle cx="68"  cy="102" r="15" fill="#101722" stroke="#2ec4c4" stroke-width="11"/>
      <circle cx="68"  cy="20"  r="20" fill="#2ec4c4"/>
    </svg>
  </div>

  <div class="txt">
    <h1>Git <em>GUI</em><span class="wip">진행 중</span></h1>
    <div class="sub">Git을 몰라도 안전하게 저장 · 협업하는 데스크톱 앱</div>
    <div class="feat">되돌리기 · 충돌 해결 · 비밀 파일 보호</div>
    <div class="chips">
      <span class="on">Rust</span>
      <span class="on">Tauri 2</span>
      <span class="pu">React</span>
      <span class="or">테스트 42</span>
      <span class="pk">3 OS CI</span>
    </div>
  </div>
</div>
</body></html>
