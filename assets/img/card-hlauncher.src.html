<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:675px;overflow:hidden;
    font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#0d0b07;}
  .card{position:relative;width:1200px;height:675px;display:flex;align-items:center;gap:62px;
    padding:0 76px;
    background:
      radial-gradient(880px 520px at 16% 28%, rgba(240,170,60,.22), transparent 62%),
      radial-gradient(760px 500px at 88% 82%, rgba(90,130,170,.16), transparent 62%),
      linear-gradient(145deg,#2a2116 0%,#1b160f 48%,#12100b 100%);}
  .grid{position:absolute;inset:0;opacity:.6;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(760px 520px at 24% 46%,#000 10%,transparent 78%);}

  .tile{position:relative;flex:0 0 300px;width:300px;height:300px;border-radius:70px;
    background:linear-gradient(160deg,#2f3742 0%,#232a33 58%,#1a2027 100%);
    border:1px solid rgba(190,205,220,.22);
    box-shadow:0 34px 70px -24px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.1),
               0 0 72px -16px rgba(240,170,60,.45);
    display:flex;align-items:center;justify-content:center;}
  .tile svg{width:196px;height:196px;overflow:visible}

  .txt{flex:1;min-width:0;padding-bottom:6px}
  h1{font-size:84px;font-weight:800;letter-spacing:-.045em;color:#ffffff;line-height:1;
     margin-bottom:20px;display:flex;align-items:center;gap:22px;white-space:nowrap}
  .wip{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#f3c178;
    padding:9px 20px 10px;border-radius:999px;margin-top:6px;white-space:nowrap;
    border:1px solid rgba(243,193,120,.5);background:rgba(243,193,120,.14)}
  .sub{font-size:28px;font-weight:700;letter-spacing:-.034em;color:#f3c178;margin-bottom:12px}
  .feat{font-size:23px;font-weight:600;letter-spacing:-.028em;color:#cdc3b0;line-height:1.5;
        margin-bottom:30px}
  .chips{display:flex;gap:11px;flex-wrap:wrap}
  .chips span{font-size:20px;font-weight:600;letter-spacing:-.02em;color:#dceaf6;
    padding:9px 20px;border-radius:999px;
    border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1)}
  .chips span.on{color:#f3c178;border-color:rgba(243,193,120,.5);background:rgba(243,193,120,.14)}
</style></head>
<body>
<div class="card">
  <div class="grid"></div>

  <div class="tile">
    <svg viewBox="0 0 200 200" fill="none">
      <g fill="#e8a33a">
        <rect x="38" y="26" width="26" height="110" rx="3"/>
        <rect x="136" y="26" width="26" height="110" rx="3"/>
        <rect x="64" y="68" width="72" height="26" rx="3"/>
      </g>
      <g>
        <rect x="26" y="150" width="148" height="28" rx="6" fill="#1a2027"/>
        <clipPath id="hz"><rect x="26" y="150" width="148" height="28" rx="6"/></clipPath>
        <g clip-path="url(#hz)" fill="#e8a33a">
          <rect x="95"  y="146" width="15" height="36" transform="skewX(-24)"/>
          <rect x="127" y="146" width="15" height="36" transform="skewX(-24)"/>
          <rect x="159" y="146" width="15" height="36" transform="skewX(-24)"/>
          <rect x="191" y="146" width="15" height="36" transform="skewX(-24)"/>
          <rect x="223" y="146" width="15" height="36" transform="skewX(-24)"/>
          <rect x="255" y="146" width="15" height="36" transform="skewX(-24)"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="txt">
    <h1>H런처<span class="wip">진행 중</span></h1>
    <div class="sub">StarCraft 안티치트 · 블랙리스트 런처</div>
    <div class="feat">단종된 제품을 리버스 엔지니어링해<br>Go로 다시 만들고 있습니다</div>
    <div class="chips">
      <span class="on">Go</span>
      <span class="on">Win32 API</span>
      <span>WebView2</span>
      <span>8,559 LOC</span>
    </div>
  </div>
</div>
</body></html>
