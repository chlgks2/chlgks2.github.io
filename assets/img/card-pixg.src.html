<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:675px;overflow:hidden;
    font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#140d05;}
  .card{position:relative;width:1200px;height:675px;display:flex;align-items:center;gap:62px;
    padding:0 76px;
    background:
      radial-gradient(880px 520px at 16% 28%, rgba(245,160,60,.28), transparent 62%),
      radial-gradient(760px 500px at 86% 80%, rgba(60,200,150,.20), transparent 62%),
      linear-gradient(145deg,#3a2510 0%,#28190a 48%,#180f06 100%);}
  .grid{position:absolute;inset:0;opacity:.6;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(760px 520px at 24% 46%,#000 10%,transparent 78%);}

  .tile{position:relative;flex:0 0 300px;width:300px;height:300px;border-radius:70px;
    background:linear-gradient(165deg,#ffffff 0%,#fff6e8 60%,#ffe9cc 100%);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 34px 70px -24px rgba(40,22,0,.8), inset 0 1px 0 rgba(255,255,255,.9),
               0 0 80px -16px rgba(245,160,60,.55);
    display:flex;align-items:center;justify-content:center;}
  .tile svg{width:196px;height:196px;overflow:visible}

  .txt{flex:1;min-width:0;padding-bottom:6px}
  h1{font-size:84px;font-weight:800;letter-spacing:-.045em;color:#ffffff;line-height:1;
     margin-bottom:20px;white-space:nowrap}
  .sub{font-size:28px;font-weight:700;letter-spacing:-.034em;color:#ffc178;margin-bottom:12px}
  .feat{font-size:23px;font-weight:600;letter-spacing:-.028em;color:#e5d2bb;line-height:1.5;
        margin-bottom:30px}
  .chips{display:flex;gap:11px;flex-wrap:wrap}
  .chips span{font-size:20px;font-weight:600;letter-spacing:-.02em;color:#dceaf6;
    padding:9px 20px;border-radius:999px;
    border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1)}
  .chips span.on{color:#6b3a06;border-color:rgba(255,255,255,.7);background:rgba(255,226,189,.94)}
</style></head>
<body>
<div class="card">
  <div class="grid"></div>

  <div class="tile">
    <svg viewBox="0 0 200 200" fill="none" shape-rendering="crispEdges">
      <g fill="#241f17">
        <rect x="76" y="24" width="48" height="24"/>
        <rect x="52" y="48" width="96" height="24"/>
      </g>
      <g fill="#f0902b">
        <rect x="52" y="72" width="96" height="48"/>
        <rect x="28" y="96" width="24" height="24"/>
        <rect x="148" y="96" width="24" height="24"/>
      </g>
      <g fill="#2fa37a">
        <rect x="52" y="120" width="96" height="24"/>
        <rect x="52" y="144" width="24" height="32"/>
        <rect x="124" y="144" width="24" height="32"/>
      </g>
      <g fill="#ffffff">
        <rect x="68" y="84" width="16" height="16"/>
        <rect x="116" y="84" width="16" height="16"/>
      </g>
    </svg>
  </div>

  <div class="txt">
    <h1>PixG</h1>
    <div class="sub">AI 픽셀 스프라이트 시트 생성기</div>
    <div class="feat">「픽셀 느낌의 이미지」에서 멈추지 않고<br>게임 에셋으로 완성했습니다</div>
    <div class="chips">
      <span class="on">Stable Diffusion</span>
      <span class="on">AnimateDiff</span>
      <span>ControlNet</span>
      <span>최우수상</span>
    </div>
  </div>
</div>
</body></html>
